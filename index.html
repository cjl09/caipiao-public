<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小彩日记</title>
  <link rel="stylesheet" href="./site.css">
  <script src="./draws.js" defer></script>
  <script src="./site.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="#today">小彩日记</a>
    <nav aria-label="主导航">
      <a href="#today">今日</a>
      <a href="#dlt">大乐透</a>
      <a href="#ssq">双色球</a>
    </nav>
  </header>
  <main>
    <section id="today" class="scratch">
      <h1>今天刮刮乐吗？</h1>
      <div id="die" class="die" role="img" aria-label="未掷骰子">⚄</div>
      <p id="decision" role="status"></p>
      <button id="roll" type="button">掷骰子</button>
      <p class="hint">单数休息，双数随机选 ¥10、¥20、¥30 或 ¥50</p>
      <p id="scratch-status" role="status"></p>
    </section>
    <section id="history" hidden>
      <div class="history-heading">
        <div><h1 id="game-name"></h1><p id="draw-summary"></p></div>
        <button id="open-editor" type="button">录入开奖</button>
      </div>
      <ol id="draw-list" class="draw-list" aria-label="开奖号码"></ol>
    </section>
  </main>
  <dialog id="editor">
    <form id="draw-form">
      <div class="dialog-heading"><h2>录入开奖</h2><button type="button" id="close-editor" class="secondary">关闭</button></div>
      <label>期号 <input name="issue" inputmode="numeric" required></label>
      <label>开奖日期 <input name="date" type="date" required></label>
      <label><span id="front-label"></span><input name="front" required placeholder="用空格分隔"></label>
      <label><span id="back-label"></span><input name="back" required placeholder="用空格分隔"></label>
      <p id="editor-status" role="status"></p>
      <div class="dialog-actions">
        <button type="submit">保存到本机</button>
        <button type="button" class="secondary" id="download">下载开奖数据</button>
      </div>
      <p class="hint">将下载的 draws.js 提交到 GitHub，更新公开站点。</p>
    </form>
  </dialog>
</body>
</html>
